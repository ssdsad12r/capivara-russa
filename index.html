<html lang="pt-BR">
<head>

<title>Capivara Russa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=PT+Sans:wght@400;700&family=Comic+Neue:wght@700&display=swap">
<style>
/* Layout: one glossy 2008 "Aero" window floating over a sky with bubbles; inside it, acid WordArt cards. Single deliberate light look. */
:root{
  color-scheme: light;
  --sky-top:#1a8fe0; --sky-mid:#6fd0ff; --sky-low:#d8f6ff;
  --grass:#5cc41a; --grass-dk:#2f7f0a;
  --acid:#c6ff00; --pink:#ff2bd6; --cyan:#00e5ff; --sun:#fff200; --orange:#ff7a00;
  --ink:#06304a; --ink-soft:#2c5a78;
  --glass:rgba(255,255,255,.62); --glass-line:rgba(0,70,130,.45);
  --ok:#2fbf2f; --ok-bg:#dfffd0; --bad:#ff2f55; --bad-bg:#ffe0e6;
  --capy:#a0703f; --capy-dk:#6b4522;
  --f-wa:"Russo One","Arial Black",Impact,sans-serif;
  --f-ui:Tahoma,Verdana,"PT Sans",system-ui,sans-serif;
  --f-capy:"Comic Neue","Comic Sans MS","Comic Sans",cursive;
}
html,body{height:100%}
body{
  margin:0; font-family:var(--f-ui); color:var(--ink); font-size:15px; line-height:1.45;
  background:
    radial-gradient(120% 60% at 50% 110%, var(--grass) 0 38%, transparent 39%),
    radial-gradient(90% 40% at 15% 105%, #7de040 0 40%, transparent 41%),
    linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-low) 80%);
  background-attachment:fixed; background-color:var(--sky-mid);
  overflow-x:hidden;
}
.bubbles{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.bubbles i{position:absolute; bottom:-80px; border-radius:50%;
  background:radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 8%, rgba(255,255,255,.25) 22%, rgba(120,220,255,.18) 60%, rgba(255,255,255,.5) 100%);
  border:1px solid rgba(255,255,255,.7); animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) translateX(30px)}}

.wrap{position:relative; z-index:1; max-width:560px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:18px 120px}

/* ---------- Aero window ---------- */
.win{border:1px solid var(--glass-line); border-radius:10px; overflow:hidden;
  background:var(--glass); backdrop-filter:blur(10px) saturate(1.3); -webkit-backdrop-filter:blur(10px) saturate(1.3);
  box-shadow:0 10px 30px rgba(0,40,90,.35), inset 0 1px 0 rgba(255,255,255,.9)}
.bar{display:flex; align-items:center; gap:8px; padding:6px 8px 6px 12px;
  background:linear-gradient(180deg,#eaf8ff 0%,#a9defd 48%,#62b8f2 50%,#a6e4ff 100%);
  border-bottom:1px solid var(--glass-line); font-weight:700; font-size:13px; color:#05325a; text-shadow:0 1px 0 #fff}
.bar .t{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wbtn{width:26px; height:18px; border-radius:4px; border:1px solid #3a6f99;
  background:linear-gradient(180deg,#fff 0%,#cfeaff 50%,#9ccff3 51%,#d8f1ff 100%); font:700 11px/16px var(--f-ui); text-align:center; color:#05325a; padding:0; cursor:default}
.wbtn.x{background:linear-gradient(180deg,#ffd2c7 0%,#f08a72 50%,#d6401f 51%,#f39a7f 100%); color:#fff; text-shadow:0 1px 0 #7a1800; border-color:#8a2a12}
.body{padding:18px}

/* ---------- Marquee ---------- */
.ticker{overflow:hidden; white-space:nowrap; background:#000; color:var(--acid); font:700 12px/24px var(--f-ui); border-top:2px solid var(--pink); border-bottom:2px solid var(--pink)}
.ticker span{display:inline-block; padding-left:100%; animation:tick 18s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---------- WordArt ---------- */
.wa{font-family:var(--f-wa); line-height:1.05; letter-spacing:.5px; display:inline-block;
  background:linear-gradient(180deg,var(--sun) 0%,var(--orange) 55%,var(--pink) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-stroke:2px #2a0050;
  filter:drop-shadow(2px 2px 0 #b200a8) drop-shadow(2px 2px 0 #6a0080) drop-shadow(2px 3px 0 #2a0050);
  text-wrap:balance}
.wa.green{background-image:linear-gradient(180deg,#ffffff 0%,var(--acid) 40%,#19b000 100%); filter:drop-shadow(2px 2px 0 #0a7a00) drop-shadow(2px 2px 0 #045200) drop-shadow(2px 3px 0 #022e00); -webkit-text-stroke-color:#022e00}
.wa.cyan{background-image:linear-gradient(180deg,#fff 0%,var(--cyan) 45%,#0050ff 100%); filter:drop-shadow(2px 2px 0 #0030aa) drop-shadow(2px 2px 0 #001a70) drop-shadow(2px 3px 0 #000c40); -webkit-text-stroke-color:#000c40}
.wa.red{background-image:linear-gradient(180deg,#fff200 0%,#ff3b00 55%,#b00020 100%); filter:drop-shadow(2px 2px 0 #7a0012) drop-shadow(2px 2px 0 #4a000a) drop-shadow(2px 3px 0 #200004); -webkit-text-stroke-color:#200004}
.tilt{transform:rotate(-3deg) skewX(-6deg)}

.sticker{position:absolute; top:-14px; right:-6px; width:78px; height:78px; display:grid; place-items:center; text-align:center;
  background:var(--sun); color:#d10000; font:900 13px/1.05 var(--f-wa); transform:rotate(14deg);
  clip-path:polygon(50% 0,61% 18%,82% 8%,80% 30%,100% 34%,86% 52%,100% 68%,79% 72%,82% 93%,61% 84%,50% 100%,39% 84%,18% 93%,21% 72%,0 68%,14% 52%,0 34%,20% 30%,18% 8%,39% 18%);
  animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--acid)}}

/* ---------- Glossy buttons ---------- */
.btn{appearance:none; cursor:pointer; border:1px solid #2f7a0a; border-radius:999px; padding:12px 22px;
  font:700 16px/1.1 var(--f-ui); color:#0b3300; text-shadow:0 1px 0 rgba(255,255,255,.8);
  background:linear-gradient(180deg,#eaffc4 0%,#a6ec5c 48%,#6fd022 50%,#a8f070 100%);
  box-shadow:inset 0 1px 0 #fff, inset 0 -2px 4px rgba(0,80,0,.25), 0 3px 8px rgba(0,60,0,.3)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible,.orb:focus-visible,.tab:focus-visible{outline:3px solid var(--pink); outline-offset:3px}
.btn.blue{border-color:#14508a; color:#002a55; background:linear-gradient(180deg,#eef9ff 0%,#9fd8ff 48%,#4aa8ee 50%,#9fe0ff 100%)}
.btn.red{border-color:#8a1022; color:#fff; text-shadow:0 1px 0 #600; background:linear-gradient(180deg,#ffd0d6 0%,#ff6d84 48%,#e8183a 50%,#ff7890 100%)}
.btn.wide{width:100%}

/* ---------- Home ---------- */
.hero{position:relative; text-align:center; padding:6px 0 10px}
.hero h1{margin:6px 0 4px; font-size:clamp(34px,9vw,52px)}
.hero p{margin:10px auto 0; max-width:42ch; color:var(--ink-soft)}
.capyrow{display:flex; align-items:flex-end; gap:10px; margin:16px 0 6px}
.capy{width:92px; height:auto; flex:none}
.speech{position:relative; flex:1; min-width:0; background:#fff; border:2px solid #000; border-radius:16px; padding:10px 12px;
  font:700 15px/1.3 var(--f-capy); box-shadow:3px 3px 0 #000}
.speech::after{content:""; position:absolute; left:-12px; bottom:14px; border:7px solid transparent; border-right-color:#000}
.stats{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 0}
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-weight:700; font-size:13px;
  background:linear-gradient(180deg,#fff,#dff3ff); border:1px solid var(--glass-line); font-variant-numeric:tabular-nums}

.path{display:grid; gap:14px; margin:18px 0 8px}
.lesson{display:flex; align-items:center; gap:14px; padding:10px 12px; border-radius:14px; background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.9)}
.lesson:nth-child(even){flex-direction:row-reverse; text-align:right}
.orb{flex:none; width:74px; height:74px; border-radius:50%; cursor:pointer; border:2px solid rgba(0,0,0,.35); font:900 30px/1 var(--f-wa); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.45);
  position:relative; box-shadow:0 5px 0 rgba(0,0,0,.25), inset 0 -8px 14px rgba(0,0,0,.2)}
.orb::before{content:""; position:absolute; left:14%; right:14%; top:6%; height:42%; border-radius:50% 50% 45% 45%; background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0))}
.orb.l1{background:radial-gradient(circle at 50% 70%,#9cff3a,#2ea800)}
.orb.l2{background:radial-gradient(circle at 50% 70%,#ffc23a,#e05a00)}
.orb.l3{background:radial-gradient(circle at 50% 70%,#5fe8ff,#0060e0)}
.orb.l4{background:radial-gradient(circle at 50% 70%,#ff6a8a,#c00020)}
.orb.done::after{content:"✓"; position:absolute; right:-4px; bottom:-4px; width:26px; height:26px; border-radius:50%; background:var(--sun); color:#000; font:900 16px/26px var(--f-ui); text-shadow:none; border:2px solid #000}
.lesson h3{margin:0; font-family:var(--f-wa); font-size:19px; font-weight:400; color:var(--ink)}
.lesson p{margin:2px 0 0; font-size:13px; color:var(--ink-soft)}
.lesson .info{min-width:0; flex:1}
.homebtns{display:grid; gap:10px; margin-top:16px}
.sign{margin:14px 0 0; text-align:center; font-size:12px; color:var(--ink-soft)}

/* ---------- Quiz ---------- */
.qtop{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.xbtn{flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--glass-line); background:#fff; font:700 16px/1 var(--f-ui); color:var(--ink); cursor:pointer}
.prog{flex:1; height:18px; border-radius:4px; border:1px solid #2b5d1a; background:linear-gradient(180deg,#cfd8cf,#f4f7f4); overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.prog i{display:block; height:100%; width:0; transition:width .35s;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 10px,transparent 10px 20px),linear-gradient(180deg,#d6ffb0 0%,#5ad11a 50%,#2fa800 51%,#7ee84a 100%)}
.hud{display:flex; gap:6px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.card{position:relative; text-align:center; padding:22px 12px 18px; border-radius:16px; margin-bottom:16px;
  background:repeating-linear-gradient(45deg,#ffffff 0 14px,#f2ffd6 14px 28px); border:3px dashed var(--pink)}
.card .lab{display:inline-block; font:700 12px/1 var(--f-ui); letter-spacing:.06em; text-transform:uppercase; background:#000; color:var(--acid); padding:5px 10px; border-radius:4px}
.card .word{font-size:clamp(34px,10vw,56px); margin:14px 0 6px; word-break:break-word}
.card .stress{font-family:"PT Sans",var(--f-ui); font-size:17px; color:var(--ink-soft)}
.card .ask{margin:12px 0 0; font-weight:700}
.opts{display:grid; gap:10px}
.opt{appearance:none; text-align:left; cursor:pointer; padding:14px 16px; border-radius:12px; font:700 16px/1.3 var(--f-ui); color:var(--ink);
  border:1px solid #6e9ac0; background:linear-gradient(180deg,#ffffff 0%,#eaf6ff 50%,#d4ecff 51%,#f2faff 100%); box-shadow:0 3px 0 #7aa6cc}
.opt:hover:not([disabled]){filter:brightness(1.04); border-color:var(--pink)}
.opt[disabled]{cursor:default}
.opt.right{background:linear-gradient(180deg,#f2ffe8,#b6f78e); border-color:var(--ok); box-shadow:0 3px 0 var(--ok)}
.opt.wrong{background:linear-gradient(180deg,#fff0f2,#ffb3c0); border-color:var(--bad); box-shadow:0 3px 0 var(--bad)}

.sheet{position:fixed; left:0; right:0; bottom:0; z-index:5; transform:translateY(105%); transition:transform .28s ease;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-top:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  border-top:4px solid var(--ok); background:var(--ok-bg); box-shadow:0 -8px 24px rgba(0,0,0,.25)}
.sheet.show{transform:none}
.sheet.bad{border-top-color:var(--bad); background:var(--bad-bg)}
.sheet .in{max-width:560px; margin:0 auto; display:grid; gap:10px; max-height:62vh; overflow:auto}
.verdict{font:400 24px/1.1 var(--f-wa); color:#106b00}
.sheet.bad .verdict{color:#b0001f}
.mean{font-weight:700; font-size:16px}
.ex{background:#fff; border:1px solid rgba(0,0,0,.15); border-radius:10px; padding:10px 12px; display:grid; gap:4px}
.ex .ru{font-family:"PT Sans",var(--f-ui); font-weight:700}
.ex .pt{color:var(--ink-soft)}
.br{font-size:14px}
.fact{font-size:14px; background:#fffbd0; border:1px dashed #c9a800; border-radius:10px; padding:8px 10px}
.capymini{display:flex; align-items:center; gap:8px; font:700 14px/1.25 var(--f-capy)}
.capymini svg{width:44px; flex:none}

/* ---------- Intro / warning ---------- */
.warn{border:3px solid #000; border-radius:12px; padding:14px; background:repeating-linear-gradient(45deg,#ffe600 0 16px,#111 16px 32px)}
.warn .inner{background:#fff; border-radius:8px; padding:12px 14px}
.warn h2{margin:0 0 6px; font-size:26px}

/* ---------- Dictionary ---------- */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px}
.tab{appearance:none; cursor:pointer; border:1px solid var(--glass-line); border-radius:6px 6px 0 0; padding:6px 10px; font:700 13px var(--f-ui); color:var(--ink);
  background:linear-gradient(180deg,#fff,#d6ecfb)}
.tab[aria-selected="true"]{background:linear-gradient(180deg,#fff200,#c6ff00); border-color:#000}
.dict{display:grid; gap:12px}
.entry{background:#fff; border:1px solid rgba(0,0,0,.15); border-radius:12px; padding:12px 14px; display:grid; gap:6px}
.entry .hw{font-family:"PT Sans",var(--f-ui); font-weight:700; font-size:20px; letter-spacing:.02em}
.entry .tag{font-style:italic; color:var(--ink-soft); font-weight:400; font-size:14px}
.entry .ex{background:#f4fbff}

/* ---------- Diploma ---------- */
.diploma{position:relative; text-align:center; padding:22px 16px; border-radius:6px;
  background:linear-gradient(180deg,#fffdf0,#fff6c9); border:6px double #b8860b; box-shadow:inset 0 0 0 2px #fff, 0 6px 18px rgba(0,0,0,.2)}
.diploma h2{margin:6px 0; font-size:clamp(30px,8vw,44px)}
.diploma .name{font:700 15px/1.4 var(--f-ui); max-width:36ch; margin:8px auto}
.seal{width:96px; height:96px; margin:12px auto 0; border-radius:50%; display:grid; place-items:center; text-align:center;
  background:radial-gradient(circle at 40% 35%,#ff8a8a,#b00000); color:#fff; font:400 12px/1.1 var(--f-wa); border:3px dashed #ffd0d0; transform:rotate(-12deg); box-shadow:0 4px 0 rgba(0,0,0,.25)}
.small{font-size:12px; color:var(--ink-soft)}

@media (prefers-reduced-motion: reduce){
  .bubbles i,.ticker span,.sticker{animation:none}
  .sheet,.prog i{transition:none}
}
@media (max-width:420px){ .orb{width:62px;height:62px;font-size:26px} .capy{width:76px} }
</style>
</head>

/* ---------- State ---------- */
const S = {xp:0, hearts:5, streak:0, done:{}, view:"home", L:null, i:0, order:[], correct:0, answered:false};

/* ---------- Sound ---------- */
let AC=null;
try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
function unlockAudio(){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state!=="running") AC.resume();
    const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0);
  }catch(e){}
}
["pointerdown","touchstart","keydown"].forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
/* WAV built in code and played through a normal <audio> element (works where Web Audio stays muted) */
function makeWav(notes, type){
  const sr=22050, dur=.11, n=Math.floor(sr*dur*notes.length), data=new Uint8Array(44+n*2), v=new DataView(data.buffer);
  const str=(o,s)=>{for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i));};
  str(0,"RIFF"); v.setUint32(4,36+n*2,true); str(8,"WAVE"); str(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); str(36,"data"); v.setUint32(40,n*2,true);
  const per=Math.floor(sr*dur);
  for(let i=0;i<n;i++){ const f=notes[Math.min(notes.length-1,Math.floor(i/per))], t=i/sr, local=(i%per)/per;
    let s = type==="sq" ? (Math.sin(2*Math.PI*f*t)>0?1:-1)*.5 : Math.asin(Math.sin(2*Math.PI*f*t))*.9;
    s *= (1-local) * .6; v.setInt16(44+i*2, Math.max(-1,Math.min(1,s))*32767, true); }
  let bin=""; for(let i=0;i<data.length;i++) bin+=String.fromCharCode(data[i]);
  return "data:audio/wav;base64,"+btoa(bin);
}
const SND = {ok:makeWav([660,880,1320],"tri"), bad:makeWav([320,220],"sq")};
function beep(ok){
  try{ const a=new Audio(ok?SND.ok:SND.bad); a.volume=1; const p=a.play(); if(p&&p.catch) p.catch(()=>beepWA(ok)); return; }catch(e){}
  beepWA(ok);
}
function beepWA(ok){
  try{
    unlockAudio();
    const t0 = AC.currentTime + .02;
    const notes = ok ? [660,880,1320] : [320,220];
    notes.forEach((f,k)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=ok?"triangle":"square"; o.frequency.value=f;
      const t=t0+k*.1; g.gain.setValueAtTime(0.0001,0); g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.0001,t+.2);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.22); });
  }catch(e){}
}

const $app = document.getElementById("app");
const $sheet = document.getElementById("sheet"), $sheetin = document.getElementById("sheetin");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };

function hideSheet(){ $sheet.classList.remove("show"); }

      </div>`).join("")}

      ${allDone ? `<button class="btn red wide" id="dip">🎓 Ver meu diploma</button>` : ``}
      <button class="btn blue wide" id="dictb">📖 Abrir o dicionário</button>
    </div>
    <p class="sign">Feito à mão por um clipper de Belgorod 💚 · ${TOTAL} palavras</p>`;
  $app.querySelectorAll(".orb").forEach(b=>b.onclick=()=>startLesson(b.dataset.l));
  document.getElementById("dictb").onclick=()=>dict(LESSONS[0].id);

}

function startLesson(id){
  const L = LESSONS.find(x=>x.id===id);
  S.L=L; S.i=0; S.correct=0; S.order=shuffle(L.items.map((_,k)=>k));
  if(L.warn){ warnScreen(); return; }
  question();
}

function warnScreen(){
  hideSheet();
  $app.innerHTML = `
    <div class="warn"><div class="inner">
      <h2 class="wa red">Cuidado! 🚨</h2>
      <p>Essas duas palavras são gírias de drogas. Não é pra usar, é só pra você entender se ouvir na rua e não cair numa conversa estranha 😅</p>
      <p class="small">Pra saber, não pra fazer.</p>
    </div></div>
    <div class="homebtns"><button class="btn red wide" id="go">Entendi, bora</button><button class="btn blue wide" id="back">Voltar</button></div>`;
  document.getElementById("go").onclick=question;
  document.getElementById("back").onclick=home;
}

function question(){
  S.view="quiz"; S.answered=false; hideSheet();
  const L=S.L, it=L.items[S.order[S.i]];
  document.getElementById("bartitle").textContent=`Lição ${L.n} — ${L.title}`;
  const opts = shuffle([it.a, ...it.d]);
  $app.innerHTML = `
    <div class="qtop">
      <button class="xbtn" id="quit" aria-label="Sair da lição">✕</button>
      <div class="prog" aria-label="progresso"><i style="width:${(S.i/L.items.length)*100}%"></i></div>
      <div class="hud"><span>❤️ ${S.hearts}</span><span>🔥 ${S.streak}</span></div>
    </div>
    <div class="card">
      <span class="lab">${esc(it.tag)}</span>
      <div class="word wa ${L.wa}">${esc(it.w)}</div>
      <div class="stress">${esc(it.ws)}</div>
      <p class="ask">O que significa?</p>
    </div>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" id="opt${k}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  document.getElementById("quit").onclick=home;
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b, it));
}

function answer(btn, it){
  if(S.answered) return; S.answered=true;
  const ok = btn.dataset.v===it.a;
  $app.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(b.dataset.v===it.a) b.classList.add("right"); });
  if(ok){ S.correct++; S.streak++; S.xp+=10; } else { btn.classList.add("wrong"); S.streak=0; S.hearts=Math.max(0,S.hearts-1); }
  beep(ok); save();
  const last = S.i===S.L.items.length-1;
  $sheet.classList.toggle("bad", !ok);
  $sheetin.innerHTML = `
    <div class="verdict">${ok?"Acertou!":"Não foi dessa vez"}</div>
    <div class="mean">${esc(it.ws)} = ${esc(it.a)}</div>
    <div class="ex"><span class="ru">${esc(it.ru)}</span><span class="pt">${esc(it.pt)}</span></div>
    ${it.br?`<div class="br">🇧🇷 Parecido com: <b>${esc(it.br)}</b></div>`:""}
    ${it.fact?`<div class="fact">💡 ${esc(it.fact)}</div>`:""}
    <div class="capymini">${capySVG(ok?"":"sad")}<span>${esc(ok?pick(YES):pick(NO))}${S.hearts===0?" Seus corações acabaram, mas a Capi te deu mais 5 ❤️":""}</span></div>
    <button class="btn ${ok?"":"red"} wide" id="next">${last?"Terminar lição":"Continuar"}</button>`;
  if(S.hearts===0) S.hearts=5;
  $sheet.classList.add("show");
  const n=document.getElementById("next"); n.focus({preventScroll:true});
  n.onclick=()=>{ if(last) finish(); else { S.i++; question(); } };
}

function finish(){
  hideSheet();
  const L=S.L; S.done[L.id]=true; S.xp+=20; save();
  const allDone = doneCount()===LESSONS.length;
  $app.innerHTML = `
    <section class="hero">
      <h2 class="wa ${L.wa} tilt" style="font-size:clamp(30px,8vw,44px);margin:10px 0">Lição completa!</h2>
      <p>Você acertou <b>${S.correct} de ${L.items.length}</b> em "${esc(L.title)}". +20 XP de bônus.</p>

    <div class="capyrow">${capySVG()}<div class="speech">${allDone?"Você terminou TUDO! Pega seu diploma 🎓":"Mandou bem! Bora pra próxima?"}</div></div>

}
